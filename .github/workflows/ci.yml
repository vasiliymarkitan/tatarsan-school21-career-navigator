name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          CN21_DISABLE_BACKGROUND: "1"
          JWT_SECRET: "ci-test-secret-please-use-32chars!"
          LLM_PROVIDER: yandex
        run: pytest -q
